<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="abialas.pl — Hi, I'm Andrzej. I do marketing.">
  <!-- Drafting-sheet hero: paper plate, blueprint grid, spectrum rule.
       Self-contained colors so it reads on GitHub light AND dark.
       Serif/mono system stand-ins for Newsreader/Geist Mono. -->
  <defs>
    <pattern id="blueprint" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#15324E" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DE3C26"/>
      <stop offset="0.28" stop-color="#2257D6"/>
      <stop offset="0.55" stop-color="#2E7D4F"/>
      <stop offset="0.78" stop-color="#A5700C"/>
      <stop offset="1" stop-color="#7A4A9E"/>
    </linearGradient>
  </defs>

  <!-- hard offset shadow, then the plate — the site's flat-window idiom -->
  <rect x="22" y="22" width="1170" height="292" fill="#15324E"/>
  <rect x="14" y="14" width="1170" height="292" fill="#EAF0F6" stroke="#15324E" stroke-width="2"/>
  <rect x="14" y="14" width="1170" height="292" fill="url(#blueprint)"/>

  <!-- measure marks (mono register) -->
  <text x="48" y="64" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" letter-spacing="3" fill="#5A6B7D">INDEX / DRAFTING SHEET</text>
  <text x="1150" y="64" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" letter-spacing="3" fill="#5A6B7D">WARSAW, PL</text>

  <!-- the nameplate -->
  <text x="48" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-1" fill="#15324E">Hi, I&#8217;m Andrzej. I do marketing.</text>
  <text x="48" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#46586B">Run as a system — not a string of campaigns.</text>

  <!-- spectrum rule: the five room hues -->
  <rect x="48" y="238" width="240" height="6" fill="url(#spectrum)"/>

  <text x="48" y="282" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" letter-spacing="2" fill="#5A6B7D">abialas.pl &#183; Astro 5 &#183; built in the open</text>
</svg>
