name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Daily rebuild so the build-time data (GitHub contribution graph, the
  # GitHub tile's last-push readout) stays current between pushes.
  # GitHub pauses scheduled workflows after 60 days without repo activity;
  # any push re-arms it.
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3 # detects the package manager, runs build, uploads the Pages artifact
        env:
          # Read by GitHubTile.astro — lifts the public API from 60 to 1000 req/h.
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
